version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel_app
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
      # keep vendor & node_modules persisted so container builds don't overwrite them:
      - vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    networks:
      - laravel

  web:
    image: nginx:stable-alpine
    container_name: laravel_web
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel

networks:
  laravel:

volumes:
  vendor:
  node_modules:
  db_data:
